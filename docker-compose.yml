services:
  postgres:
    image: postgres:16-alpine
    container_name: sift-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sift
    ports:
      - "5433:5432"
    volumes:
      - sift-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sift"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sift-postgres-data:
